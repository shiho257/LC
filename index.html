    background: black;
    background-repeat: no-repeat;
    background-size: cover;
    color: rgba(250,250,100,1);

    text-align: center;

  #root {
    width: 100vw;
    height: 100vh;
    position: relative; 
    display: flex;
    justify-content: center;
    align-items: center;
  }

  @keyframes fade-in {
    0%{opacity:0;}
    100%{ opacity: 1; }
  }
  @keyframes floaty {
    0% { transform: translateZ(16em); }
    50% { transform: translateZ(15.5em); }
  }
  @keyframes rotate {
    0%{ transform: rotateZ(0deg) translateZ(2em) rotateX(-90deg) rotateY(45deg); }
    50%{ transform: rotateZ(180deg) translateZ(1.5em) rotateX(-90deg) rotateY(45deg); }
    100%{ transform: rotateZ(360deg) translateZ(2em) rotateX(-90deg) rotateY(45deg); }
  }
  @keyframes wiggle {
    0%, 100%{ transform: translateZ(4em) rotateX(0deg); }
    11% { transform: translateZ(4em) rotateX(1deg) rotateY(-1deg); }
    22% { transform: translateZ(4em) rotateX(1deg) rotateY(1deg); }
    33% { transform: translateZ(4em) rotateX(1deg) rotateY(0deg); }
    44% { transform: translateZ(4em) rotateX(-1deg) rotateY(-1deg); }
    55% { transform: translateZ(4em) rotateX(1deg) rotateY(1deg); }
    66% { transform: translateZ(4em) rotateX(-1deg) rotateY(0deg); }
  }
  @keyframes down {
    0%{transform: translateZ(16em);}
    100%{transform: translateZ(4em);}
  }
  @keyframes up {
    0%{ transform: translateZ(4em) rotateX(0deg); }
    100%{ transform: translateZ(16em) rotateX(0deg); }
  }

  .qmark {
    font-size: 3em;
    font-weight: 700;
    text-shadow: 0 0 1em 0em rgba(250,250,0,1);
    position: absolute;
    transform: translateZ(1em) translateX(.8em) translateY(.5em) rotateX(-90deg) rotateY(45deg);
  }

  .heart-gift{ 
    color: crimson;
    animation: rotate 2s infinite linear, fade-in 1.5s ease;
    opacity: 1;
    font-size: 3em;
    z-index: 2; 
    position: absolute;
    transform-origin: 50% 50%;
    text-shadow: 0 0 .1em crimson;
  }


  .floor {
    position: absolute;
    top: 62%;
    left: 50%;
    margin-top: -10em; 
    margin-left: -10em; 
    display: flex;
    align-items: center;
    justify-content: center; 
    z-index: 1;
    height: 20em;
    width: 20em;
    transform: rotateX(45deg) rotateZ(45deg); 
    transform-style: preserve-3d;
    perspective: 1200px; 
  }

  .box {
    z-index: 1;  
    position: relative;
    transform: translateZ(6em);
    transform-style: preserve-3d;  
  }
  .face {
    height: 6em; width: 6em; position: absolute; z-index: 1;
    box-shadow: 0 0 .5em .25em rgba(0,0,0,.2) inset;
  }
  .top {
    background-color: #880E4F; 
    background-image: linear-gradient(-90deg, transparent 49%, #F8BBD0), linear-gradient(0deg, transparent 49%, #F8BBD0);
    transform: translateZ(3em);
    box-shadow: 0 0 0 .4em #C2185B inset; 
  }
  .right {
    background-image: linear-gradient(to top, rgba(0,0,0,0) 33%, #F48FB1 34% 65%, rgba(0,0,0,0) 66%);
    background-color: #AD1457; transform: rotateY(90deg) translateZ(3em);
  }
  .left {
    background-image: linear-gradient(to right, rgba(0,0,0,0) 33%, #F8BBD0 33% 66%, rgba(0,0,0,0) 66%);
    background-color: #C2185B; transform: rotateX(-90deg) translateZ(3em);
  }

  .lid{ 
    animation: wiggle 1.5s infinite cubic-bezier(.2,1.2,.6,1.1); 
    position: absolute; height: 6.5em; width: 6.5em;  
    transform-style: preserve-3d; z-index: 2; cursor: pointer;
  }
  .open{
    transform: translateZ(16em); 
    animation: up 1s ease-out, floaty 2s 1s infinite linear;
    pointer-events: none;
  }
  .close { 
    transform: translateZ(4em);
    animation: down 1s ease-out, wiggle 1.5s 1s infinite cubic-bezier(.2,1.2,.6,1.1); 
  }
  .ltop {
    height: 6.5em; width: 6.5em; background-color: #E91E63;
    background-image: linear-gradient(to right, rgba(0,0,0,0) 33%, #F8BBD0 34% 65%, rgba(0,0,0,.1) 66% 68%, rgba(0,0,0,0) 69%),
    linear-gradient(to top, rgba(0,0,0,0) 33%, #F48FB1 34% 65%, rgba(0,0,0,0) 66%);
  }
  .lright {
    z-index: 2; background-color: #D81B60; width: 3em; height: 6.5em;
    transform: rotateY(90deg) translateX(1.5em) translateZ(5em);
    background-image: linear-gradient(to top, rgba(0,0,0,0) 33%, #F8BBD0 34% 65%, rgba(0,0,0,0) 66%);
  }
  .lleft {
    height: 3em; width: 6.5em; background-color: #AD1457;
    background-image: linear-gradient(to right, rgba(0,0,0,0) 33%, #FFCDD2 33% 66%, rgba(0,0,0,0) 66%);
    transform: rotateX(-90deg) translateY(1.5em) translateZ(5em);
  }


  .message-container {
    position: absolute;
    bottom: 30px; 
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    z-index: 996;
    padding: 0 20px;
    box-sizing: border-box; 
  }

  .message {
    width: 100%;
    max-width: 600px;
    text-align: center;
    font-size: clamp(3.1rem, 4vw, 1.8rem);

    line-height: 1.2;
    margin: 0;
    margin-bottom: 10%;
  }

  .see-photos-btn {
    background: rgba(255, 20, 147, 0.2);

    font-weight: 600;
    font-size: 0.9rem;

    box-shadow: 0 0 10px rgba(255, 20, 147, 0.4);
    pointer-events: auto;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fade-in 1s ease forwards;
    backdrop-filter: blur(5px);
  }
  .see-photos-btn:hover {
    background: #ff1493;
    color: white;
    transform: scale(1.05);
  }

  
  .gallery-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%);
    backdrop-filter: blur(10px);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 998; opacity: 0; animation: fade-in 1s forwards; text-shadow: none;
  }
  
  .back-btn {
    position: absolute;
    top: 25px;
    left: 20px;
    background: rgba(255, 20, 147, 0.2);
    border: 2px solid #ff1493;
    color: #ffb3e6;
    padding: 8px 16px;
    border-radius: 25px;
    cursor: pointer;
    font-family: 'Indie Flower', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    z-index: 1000;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(5px);
  }
  .back-btn:hover {
    background: #ff1493;
    color: white;
    transform: scale(1.05);
  }

  .carousel-title {
    color: white; 
    text-shadow: 0 0 10px pink; 
    margin-top: 50px; 
    margin-bottom: 20px; 
    font-family: 'Indie Flower', sans-serif;
    font-size: 1.2rem;
  }

  .carousel-container {
    position: relative; width: 100%; height: 55vh;
    display: flex; justify-content: center; align-items: center; perspective: 1200px;
  }

  .card-wrapper {
    position: absolute; width: 70vw; max-width: 300px; aspect-ratio: 3/4;
    transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    cursor: pointer; transform-style: preserve-3d;
  }

  .card-wrapper.flipped .card-inner { transform: rotateY(180deg); }

  .card-inner {
    width: 100%; height: 100%; position: relative;
    transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-style: preserve-3d;
  }

  .card-front, .card-back {
    width: 100%; height: 100%; position: absolute;
    backface-visibility: hidden; border-radius: 15px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }

  .card-front {
    background: #fff; padding: 12px 12px 60px 12px; box-sizing: border-box; text-shadow: none;
  }
  
  .photo-img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

  .hint-text {
    position: absolute; bottom: 20px; left: 0; width: 100%;
    text-align: center; color: #555; font-family: 'Indie Flower', sans-serif;
    font-size: 1rem; font-weight: bold; text-shadow: none;
  }

  .card-back {
    background-image: url('15.jpeg'); 
    background-size: cover; background-position: center; background-color: #222;
    transform: rotateY(180deg); display: flex; justify-content: center; align-items: center;
    padding: 20px; box-sizing: border-box; border: 8px solid #fff;
  }

  .text-container {
    background: rgba(255, 255, 255, 0.9);
    padding: 20px; border-radius: 12px; width: 100%;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-shadow: none;
  }

  .dedicatory-text {
    color: #e76091; font-family: 'Indie Flower', cursive;
    font-size: 1.6rem; line-height: 1.4; text-align: center; margin: 0; font-weight: bold;
  }

  .controls {
    display: flex; align-items: center; gap: 30px; margin-top: 30px; z-index: 999;
  }

  .nav-btn {
    background: rgba(255, 20, 147, 0.5); border: 2px solid #ff1493; color: white;
    font-size: 1.5rem; width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
    display: flex; justify-content: center; align-items: center; transition: all 0.3s; text-shadow: none;
  }
  .nav-btn:hover { background: #ff1493; transform: scale(1.2); }
  
  .counter {
    color: white; font-family: 'Poppins', sans-serif; font-size: 1.2rem; font-weight: bold; text-shadow: 0 0 10px #ff1493;
  }

  #confetti-canvas, #hearts-canvas {
    position: fixed; top: 0; left: 0; pointer-events: none; width: 100vw; height: 100vh; z-index: 9999;

<body>

<div id="root"></div>
<canvas id="confetti-canvas"></canvas>
<canvas id="hearts-canvas"></canvas>

<script src='https://cdnjs.cloudflare.com/ajax/libs/react/16.8.5/umd/react.production.min.js'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/react-dom/16.8.5/umd/react-dom.production.min.js'></script>

<script type="text/babel">
  const { useEffect, useState } = React;

  const myPhotos = [
    { img: "6.jpg", text: "Ngủ đủ giấc" },
    { img: "5.jpg", text: "Tiêu nhiều tiền" },
    { img: "4.jpg", text: "Ăn đồ ngon" },
    { img: "1.jpg", text: "Được làm công chúa :v" },
    { img: "7.jpg", text: "Duyệt chứng từ nhanh" },
    { img: "3.jpg", text: "Nhiều ảnh đẹp" },
    { img: "8.jpg", text: "Đi chơi nhiều nơi" },
    { img: "2.jpg", text: "Xinh đẹp" },
    { img: "9.png", text: "Vui vẻ" },
    { img: "10.png", text: "Cho a vào danh sách thân thiết đi để kể nhiều chuyện :v" },
  ];

  const Carousel = ({ onBack }) => {
    const [currentIndex, setCurrentIndex] = useState(0);
    const [flippedStates, setFlippedStates] = useState(Array(myPhotos.length).fill(false));

    const next = () => {
      setCurrentIndex((prev) => (prev + 1) % myPhotos.length);
      setFlippedStates(Array(myPhotos.length).fill(false)); 
    };
    
    const prev = () => {
      setCurrentIndex((prev) => (prev - 1 + myPhotos.length) % myPhotos.length);
      setFlippedStates(Array(myPhotos.length).fill(false));
    };

    const toggleFlip = (index) => {
      if(index === currentIndex) {
        const newStates = [...flippedStates];
        newStates[index] = !newStates[index];
        setFlippedStates(newStates);
      } else {
        setCurrentIndex(index);
        setFlippedStates(Array(myPhotos.length).fill(false));
      }
    };

    return (
      <div className="gallery-overlay">
        <button className="back-btn" onClick={onBack}>
          <i className="fas fa-arrow-left"></i> Return
        </button>

        <h2 className="carousel-title">Lyi.chnn</h2>
        
        <div className="carousel-container">
          {myPhotos.map((photo, index) => {
            let visibleOffset = index - currentIndex;
            if (visibleOffset > myPhotos.length / 2) visibleOffset -= myPhotos.length;
            if (visibleOffset < -myPhotos.length / 2) visibleOffset += myPhotos.length;
            
            const absVis = Math.abs(visibleOffset);
            const isActive = visibleOffset === 0;
            const translateX = visibleOffset * 65; 
            const scale = isActive ? 1 : Math.max(0.7, 1 - absVis * 0.15);
            const rotateY = isActive ? 0 : (visibleOffset > 0 ? -25 : 25);
            const zIndex = 50 - absVis;
            const opacity = absVis > 2 ? 0 : (isActive ? 1 : 0.6);
            const isFlipped = flippedStates[index];

            return (
              <div 
                key={index}
                className={`card-wrapper ${isFlipped ? 'flipped' : ''}`}
                style={{
                  transform: `translateX(${translateX}%) scale(${scale}) rotateY(${rotateY}deg)`,
                  zIndex: zIndex,
                  opacity: opacity,
                  pointerEvents: opacity === 0 ? 'none' : 'auto'
                }}
                onClick={() => toggleFlip(index)}
              >
                <div className="card-inner">
                  <div className="card-front">
                    <img src={photo.img} className="photo-img" alt="Recuerdo" />
                    <div className="hint-text"><i className="fas fa-undo"></i> For you</div>
                  </div>
                  <div className="card-back">
                    <div className="text-container">
                      <p className="dedicatory-text">{photo.text}</p>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        
        <div className="controls">
          <button className="nav-btn" onClick={prev}><i className="fas fa-chevron-left"></i></button>
          <div className="counter">{currentIndex + 1} / {myPhotos.length}</div>
          <button className="nav-btn" onClick={next}><i className="fas fa-chevron-right"></i></button>
        </div>
      </div>
    );
  };

  const GiftBox = () => {
    const [open, setOpen] = useState(false);
    const [wasOpen, setWasOpen] = useState(false);
    const [showCarousel, setShowCarousel] = useState(false);
    const [timerFinished, setTimerFinished] = useState(false);

    useEffect(() => {
      let timer;
      if (open && !timerFinished) {
        startConfetti(); 
        
        timer = setTimeout(() => {
          setShowCarousel(true);
          startHeartExplosion();
          setTimerFinished(true); 
        }, 4500); 
      }
      return () => clearTimeout(timer);
    }, [open, timerFinished]);

    const handleBoxClick = () => {
      if (!open) {
        setOpen(true);
        setWasOpen(true);
      }
    };

    const handleCloseCarousel = () => {
      setShowCarousel(false);
    };

    const handleOpenCarousel = () => {
      setShowCarousel(true);
      startHeartExplosion();
    };

    return (
      <React.Fragment>
        <div className="floor">
          <div className="box">
            {open && <i className="fa fa-heart heart-gift"></i>}
            <div
              className={`lid ${open ? 'open' : wasOpen ? 'close' : ''}`}
              onClick={handleBoxClick}
            >
              <div className="qmark">{open ? '!' : '?'}</div>
              <div className="face ltop"></div>
              <div className="face lleft"></div>
              <div className="face lright"></div>
            </div>
            <div className="face top"></div>
            <div className="face left"></div>
            <div className="face right"></div>
          </div>
        </div>

        {open && !showCarousel && (
          <div className="message-container">
            <p className="message">
              Quà của e này ~
            </p>
            {timerFinished && (
              <button className="see-photos-btn" onClick={handleOpenCarousel}>
                <i className="fas fa-images"></i> Here
              </button>
            )}
          </div>
        )}

        {showCarousel && <Carousel onBack={handleCloseCarousel} />}
      </React.Fragment>
    );
  };

  ReactDOM.render(<GiftBox />, document.getElementById('root'));

  function startConfetti() {
    if(window.confettiRunning) return;
    window.confettiRunning = true;

    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const confetti = [];
    for (let i = 0; i < 150; i++) {
      confetti.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        d: Math.random() * 50 + 10,
        color: `hsl(${Math.random() * 20 + 320}, 100%, 75%)`, 
        tilt: Math.random() * 10 - 5,
        tiltAngleIncrement: Math.random() * 0.07 + 0.05,
        tiltAngle: 0
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confetti.forEach(c => {
        ctx.beginPath();
        ctx.lineWidth = c.r;
        ctx.strokeStyle = c.color;
        ctx.moveTo(c.x + c.tilt + c.r / 2, c.y);
        ctx.lineTo(c.x + c.tilt, c.y + c.tilt + c.r / 2);
        ctx.stroke();
      });
      update();
      requestAnimationFrame(draw);
    }

    function update() {
      confetti.forEach(c => {
        c.tiltAngle += c.tiltAngleIncrement;
        c.y += (Math.cos(c.d) + 3 + c.r / 2) * 0.5;
        c.x += Math.sin(c.tiltAngle) * 2; 
        c.tilt = Math.sin(c.tiltAngle) * 15;

        if (c.y > canvas.height) {
          c.y = -10;
          c.x = Math.random() * canvas.width;
        }
      });
    }
    draw();
  }

  function startHeartExplosion() {
    const canvas = document.getElementById('hearts-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const hearts = [];
    const colors = ['#ff4d4d', '#ff80df', '#ff1a75', '#ffffff', '#ff99cc'];
    const startX = canvas.width / 2;
    const startY = canvas.height / 2;

    for (let i = 0; i < 150; i++) {
      hearts.push({
        x: startX,
        y: startY + 50,
        vx: (Math.random() - 0.5) * 35,
        vy: (Math.random() - 1) * 30 - 5,
        size: Math.random() * 1.5 + 0.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 10
      });
    }

    const gravity = 0.6; 

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let allDead = true;

      hearts.forEach(h => {
        if (h.y < canvas.height + 50) allDead = false;

        h.vy += gravity;
        h.x += h.vx;
        h.y += h.vy;
        h.rotation += h.rotationSpeed;

        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.rotate((h.rotation * Math.PI) / 180);
        ctx.scale(h.size, h.size);
        ctx.fillStyle = h.color;
        
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-10, -10, -20, 5, 0, 20);
        ctx.bezierCurveTo(20, 5, 10, -10, 0, 0);
        ctx.fill();
        ctx.restore();
      });

      if (!allDead) {
        requestAnimationFrame(draw);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    draw();
  }
</script>
